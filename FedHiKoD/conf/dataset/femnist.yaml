name: femnist
model: FEMNISTNet
data_dir: datasets/femnist
num_classes: 62
learning_rate: 0.001
train_batch_size: 64
test_batch_size: 8
weight_decay: 0.0005
client_fraction: 0.2
ditto_lambda: 0.1
error_threshold: 0.3
eta: 0.01
train_samples_file: training_samples_v1.json
global_rounds: 300
local_rounds: 5
qfedavg_q: 0.4
fedhikod:
  beta: 0.4
  kd_alpha: 0.3
  kd_temp: 2.0